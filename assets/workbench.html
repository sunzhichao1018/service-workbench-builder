<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>业务工作台</title>
  <style>
    :root{--bg:#f4f7fc;--panel:#fff;--text:#17243b;--muted:#68768c;--border:#e3eaf4;--blue:#285ee7;--blue-soft:#edf3ff;--green:#187a56;--orange:#b56816;--red:#bd3b49;--shadow:0 8px 30px #14285006;--radius:16px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:3px}button{cursor:pointer}button:disabled{cursor:wait;opacity:.6}button:focus-visible,a:focus-visible{outline:3px solid #9ebcff}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button{border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text);padding:8px 13px}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.secondary{background:var(--blue-soft);border-color:transparent;color:var(--blue)}.muted{color:var(--muted)}.small{font-size:12px}.mono{font-variant-numeric:tabular-nums;font-family:"SFMono-Regular",Consolas,monospace}h1,h2,h3,p{margin-top:0}h1{font-size:28px;line-height:1.3;margin-bottom:8px;letter-spacing:-.5px}h2{font-size:17px;line-height:1.4;margin-bottom:6px}h3{font-size:14px}.shell{display:flex;min-height:100vh}.sidebar{width:226px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--border);padding:26px 18px;z-index:20}.brand{display:flex;gap:11px;align-items:center;padding:0 9px 26px}.logo{display:grid;place-items:center;flex:none;background:var(--blue);color:#fff;width:38px;height:38px;border-radius:11px;font-weight:800;font-size:20px;box-shadow:0 5px 12px #285ee728}.brand-title{font-size:15px;font-weight:750;overflow-wrap:anywhere;line-height:1.4}.brand-subtitle{font-size:10px;letter-spacing:1.5px;color:var(--muted);margin-top:3px}.nav-title{font-size:10px;letter-spacing:1px;color:#98a3b5;padding:0 13px 10px}.nav{display:grid;gap:6px}.nav button{text-align:left;padding:11px 13px;display:flex;gap:13px;align-items:center;border:0;background:transparent;color:var(--muted);font-weight:550}.nav button.active{color:var(--blue);background:var(--blue-soft)}.nav-icon{width:20px;font-size:17px;text-align:center}.sidebar-bottom{margin-top:auto;padding:24px 12px 0}.status-dot{display:inline-block;width:7px;height:7px;background:#22a979;border-radius:50%;margin-right:6px}.main{width:calc(100% - 226px);margin-left:226px;min-width:0}.topbar{height:70px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#ffffffed;border-bottom:1px solid var(--border);padding:0 32px;backdrop-filter:blur(12px)}.breadcrumb{display:flex;gap:10px;align-items:center;min-width:0}.breadcrumb strong{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-actions{display:flex;align-items:center;gap:13px;white-space:nowrap}.pill{padding:3px 9px;background:#f0f5ff;border:1px solid #e0e9fb;color:#4a6ea7;font-size:11px;border-radius:20px}.menu-button{display:none}.content{max-width:1650px;padding:32px;margin:auto}.page-header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:25px}.eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--blue);font-weight:700;margin-bottom:9px}.page-description{color:var(--muted);margin-bottom:0;font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}.metric{padding:20px 21px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.metric-label{font-size:12px;color:var(--muted);margin-bottom:9px}.metric-number{font-size:31px;font-weight:750;letter-spacing:-1px;line-height:1.35}.metric-unit{font-size:12px;font-weight:500;color:var(--muted);margin-left:5px;letter-spacing:0}.metric-note{margin-top:10px;font-size:11px;color:var(--muted)}.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px}.panel-header{padding:20px 22px;display:flex;justify-content:space-between;gap:18px;align-items:center}.panel-description{font-size:12px;color:var(--muted);margin:0}.panel-body{padding:0 22px 22px}.grid-two{display:grid;grid-template-columns:1fr 1.2fr;gap:22px}.bar-row{display:grid;grid-template-columns:100px minmax(60px,1fr) 40px;gap:12px;align-items:center;margin:16px 0}.bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.bar-track{height:8px;background:#f0f4fa;border-radius:10px;overflow:hidden}.bar-fill{height:100%;background:var(--blue);border-radius:10px}.bar-value{text-align:right;font-size:12px;color:var(--muted)}.notice{padding:13px 16px;margin-bottom:20px;border:1px solid #dee8fb;background:#f2f6ff;border-radius:11px;font-size:12px;color:#506b99}.error{background:#fff1f2;color:#a82d3c;border-color:#f3d4d8;overflow-wrap:anywhere}.warning{background:#fff9ee;border-color:#f4e4bf;color:#896021}.notice:last-child{margin-bottom:0}.filters{display:flex;flex-wrap:wrap;gap:10px;padding:0 22px 18px;align-items:center}.filters input{flex:1;min-width:180px}.filters select{min-width:130px}input,select,textarea{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:8px;padding:9px 11px;max-width:100%}input::placeholder,textarea::placeholder{color:#9aa7b9}.table-wrap{overflow:auto;max-height:620px}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th{background:#f8fafd;color:#7b879a;font-size:11px;font-weight:550;text-align:left;padding:12px 18px;position:sticky;top:0;z-index:1;border-bottom:1px solid var(--border)}td{padding:14px 18px;border-bottom:1px solid #eef2f8;max-width:350px;overflow:hidden;text-overflow:ellipsis}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafcff}.table-title{font-weight:600;color:#283b59}.table-action{color:var(--blue);background:transparent;border:0;padding:2px 0}.table-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;border-top:1px solid var(--border);color:var(--muted);font-size:11px}.badge{display:inline-block;border-radius:5px;font-size:11px;padding:2px 7px;background:#edf3fc;color:#4e6b98}.badge.good{background:#eaf7f0;color:var(--green)}.badge.warn{background:#fff5e6;color:var(--orange)}.badge.bad{background:#fff0f1;color:var(--red)}.empty{display:flex;align-items:center;justify-content:center;text-align:center;min-height:170px;padding:30px;color:var(--muted);font-size:13px}.footer{color:#8a96a9;font-size:11px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:28px;padding-top:18px;border-top:1px solid var(--border)}.finance-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.finance-block{padding:20px;border:1px solid var(--border);border-radius:12px}.finance-line{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid #f0f3f8}.finance-line:last-child{border:0;font-weight:700}.finance-currency{font-size:12px;color:var(--blue);font-weight:700;margin-bottom:5px}.source-id{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.quality-list{display:grid;gap:10px}.quality-item{padding:12px 14px;background:#fff9ef;color:#8d6630;border-radius:8px;font-size:12px;overflow-wrap:anywhere}dialog{padding:0;border:1px solid var(--border);border-radius:18px;max-width:650px;width:calc(100% - 32px);box-shadow:0 30px 120px #17243b30}dialog::backdrop{background:#17243b66;backdrop-filter:blur(3px)}.dialog-header{display:flex;justify-content:space-between;gap:20px;padding:23px;border-bottom:1px solid var(--border)}.dialog-header h2{margin-bottom:4px}.close{font-size:19px;padding:1px 9px;align-self:flex-start}.dialog-body{padding:23px;max-height:70vh;overflow:auto}.details{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}.detail-label{font-size:11px;color:var(--muted);margin-bottom:3px}.detail-value{font-size:13px;overflow-wrap:anywhere}.form-label{display:block;font-size:12px;font-weight:600;margin:15px 0 7px}textarea{display:block;width:100%;min-height:105px;resize:vertical}.dialog-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:20px}.loading{min-height:55vh;display:grid;place-items:center;color:var(--muted)}.hidden{display:none!important}
    @media(max-width:1100px){.grid-two{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{padding:0 24px}.content{padding:26px 24px}}
    @media(max-width:760px){.sidebar{transform:translateX(-100%);transition:transform .2s;box-shadow:10px 0 40px #17243b10}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.menu-button{display:block;padding:4px 9px;margin-right:4px}.topbar{padding:0 16px;height:62px}.top-actions .pill{display:none}.top-actions{gap:7px}.breadcrumb{gap:6px}.content{padding:24px 16px}.page-header{gap:10px}.page-header h1{font-size:23px}.page-header>button{padding:7px 10px;font-size:12px}.cards{gap:10px}.metric{padding:16px}.metric-number{font-size:26px}.panel-header{padding:18px 16px}.panel-body{padding:0 16px 18px}.filters{padding:0 16px 16px}.filters input{min-width:100%;width:100%}.filters select{flex:1;min-width:90px}.details{gap:14px}.footer{display:block}.footer span{display:block;margin-bottom:5px}.nav-title{padding-top:12px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="工作台导航">
      <div class="brand"><div class="logo" aria-hidden="true">W</div><div><div class="brand-title" id="brand-title">业务工作台</div><div class="brand-subtitle">WORKBENCH</div></div></div>
      <div class="nav-title">工作空间 / WORKSPACE</div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-bottom"><div class="small"><span class="status-dot"></span>本地单人工作空间</div><div class="muted small" style="margin-top:6px">数据与跟进记录保存在本机</div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="breadcrumb"><button class="menu-button" id="menu-toggle" aria-label="展开或收起导航" aria-expanded="false">☰</button><span class="muted small">工作空间</span><span class="muted">/</span><strong id="breadcrumb">总览</strong></div><div class="top-actions"><span class="pill">本地单机</span><button id="reload" class="small">↻ 读取最新快照</button></div></header>
      <div class="content"><div id="global-error" class="notice error hidden" role="alert"></div><div id="page" aria-live="polite"><div class="loading">正在读取工作空间…</div></div><footer class="footer" id="footer"></footer></div>
    </main>
  </div>
  <dialog id="task-dialog" aria-labelledby="dialog-title"><div class="dialog-header"><div><h2 id="dialog-title">任务跟进</h2><div class="muted small" id="dialog-id"></div></div><button class="close" id="dialog-close" aria-label="关闭">×</button></div><div class="dialog-body" id="dialog-body"></div></dialog>
  <script>
  'use strict';
  const $ = id => document.getElementById(id);
  let state = null;
  let activePage = 'dashboard';
  let filters = {q:'', owner:'', status:''};
  const moduleDefinitions = [
    {id:'dashboard',label:'工作总览',icon:'◫'}, {id:'tasks',label:'任务中心',icon:'☷'},
    {id:'objects',label:'业务对象',icon:'▦'}, {id:'executions',label:'执行验收',icon:'✓'},
    {id:'finance',label:'收支分析',icon:'↗'}, {id:'data',label:'数据质量',icon:'◈'}
  ];
  const el = (tag, cls, text) => {const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined&&text!==null)node.textContent=String(text);return node;};
  const append = (parent,...children) => {for(const child of children)if(child)parent.append(child);return parent;};
  const text = value => value===undefined||value===null||value===''?'—':String(value);
  const number = value => value===undefined||value===null||value===''?'—':typeof value==='number'?value.toLocaleString('zh-CN',{maximumFractionDigits:4}):String(value);
  const arr = value => Array.isArray(value)?value:[];
  const datasets = () => state.datasets||{};
  const label = (key,fallback) => (state.workspace.labels||{})[key]||fallback;
  const errorText = error => error instanceof Error?error.message:String(error);
  function badge(value){const v=text(value);let cls='badge';if(/逾期未完成|异常|拒绝|失败/.test(v))cls+=' bad';else if(/待确认|待验收|逾期完成|未验收/.test(v))cls+=' warn';else if(/已完成|已验收|通过|已跟进|按期完成/.test(v))cls+=' good';return el('span',cls,v);}
  function empty(message){return el('div','empty',message||'当前没有可展示的数据。');}
  function notice(message,cls=''){return el('div','notice '+cls,message);}
  function button(caption,handler,cls=''){const node=el('button',cls,caption);node.type='button';node.addEventListener('click',handler);return node;}
  function downloadButton(dataset){const a=el('a','small','导出 CSV ↗');a.href='/api/export?dataset='+encodeURIComponent(dataset);a.setAttribute('download','');return a;}
  function panel(title,description,action){const node=el('section','panel');const head=el('div','panel-header');const titleBox=append(el('div'),el('h2','',title),description?el('p','panel-description',description):null);append(head,titleBox,action);node.append(head);return node;}
  function header(title,description,action){const h=el('div','page-header');append(h,append(el('div'),el('div','eyebrow','YOUR BUSINESS · YOUR WORKSPACE'),el('h1','',title),el('p','page-description',description)),action);return h;}
  function table(columns,rows,emptyMessage){if(!rows.length)return empty(emptyMessage);const wrap=el('div','table-wrap');const t=el('table');const head=el('thead');const hrow=el('tr');columns.forEach(c=>hrow.append(el('th','',c.label)));head.append(hrow);const body=el('tbody');for(const row of rows){const tr=el('tr');for(const column of columns){const td=el('td',column.className||'');if(column.render){const result=column.render(row);if(result instanceof Node)td.append(result);else td.textContent=text(result);}else td.textContent=text(row[column.key]);if(!column.render)td.title=text(row[column.key]);tr.append(td);}body.append(tr);}append(t,head,body);wrap.append(t);return wrap;}
  function renderCards(){const container=el('div','cards');for(const card of arr(state.summary.cards)){const node=el('article','metric');const value=el('div','metric-number',number(card.value));if(card.unit)value.append(el('span','metric-unit',card.unit));append(node,el('div','metric-label',card.label),value,el('div','metric-note',card.note||'以本次数据快照为准'));container.append(node);}return container;}
  function taskColumns(withAction=true){const columns=[{key:'title',label:label('task','任务'),className:'table-title'},{key:'object_name',label:label('object','业务对象')},{key:'owner',label:'负责人'},{key:'due_date',label:'到期日'},{label:'判定状态',render:r=>badge(r.fulfillment_status)},{label:'跟进状态',render:r=>badge(r.tracking_status||'待跟进')}];if(withAction)columns.push({label:'操作',render:r=>button('查看 / 跟进',()=>openTask(r),'table-action')});return columns;}
  function renderDashboard(){const page=$('page');append(page,header('工作总览','围绕业务事实、履约缺口与待办，查看当前全量数据快照。'));const cards=renderCards();if(cards.children.length)page.append(cards);else page.append(notice('尚未配置指标。上传文件并确认业务口径后，由助手生成对应指标。'));const grid=el('div','grid-two');const distribution=panel('任务状态分布','全量任务按业务判定状态统计');const body=el('div','panel-body');const groups=arr(state.summary.groups);const max=Math.max(1,...groups.map(g=>Number(g.count)||0));for(const group of groups){const track=el('div','bar-track');const fill=el('div','bar-fill');fill.style.width=((Number(group.count)||0)/max*100)+'%';track.append(fill);append(body,append(el('div','bar-row'),el('div','bar-label',group.name),track,el('div','bar-value mono',number(group.count))));}if(!groups.length)body.append(empty('没有任务状态数据。'));distribution.append(body);grid.append(distribution);const needs=arr(state.task_views).filter(t=>/逾期未完成|待确认|待验收/.test(t.fulfillment_status||''));const followup=panel('优先关注','逾期、待确认与待验收事项',moduleEnabled('tasks')?button('进入任务中心 →',()=>navigate('tasks'),'secondary small'):null);followup.append(table(taskColumns().filter(c=>c.key!=='owner'),needs.slice(0,8),'当前没有需要优先关注的事项。'));grid.append(followup);page.append(grid);const finance=arr(state.summary.finance);if(finance.length&&moduleEnabled('finance')){const p=panel('收支概览','仅实际流水按原始币种分别汇总，未做汇率换算');const b=el('div','panel-body');b.append(financeCards(finance));p.append(b);page.append(p);}const warnings=arr(state.quality.warnings);if(warnings.length)page.append(notice('有 '+warnings.length+' 项数据提示，请到数据质量查看详情。','warning'));}
  function renderTasks(){const page=$('page');append(page,header(label('task','任务')+'中心','查看来源事实与业务判定，独立记录跟进进展。',downloadButton('tasks')),notice('以下筛选只作用于本页任务列表；总览指标始终反映全量快照。跟进状态与备注不会改变验收事实或指标分母。'));const p=panel('任务列表','支持按标题、业务对象、编号和负责人检索');const filterBar=el('div','filters');const search=el('input');search.type='search';search.placeholder='搜索标题、对象、编号、负责人…';search.setAttribute('aria-label','检索任务');search.value=filters.q;const owner=el('select');owner.setAttribute('aria-label','按负责人筛选');const status=el('select');status.setAttribute('aria-label','按判定状态筛选');appendOptions(owner,'全部负责人',arr(state.task_views).map(t=>t.owner));appendOptions(status,'全部判定状态',arr(state.task_views).map(t=>t.fulfillment_status));owner.value=filters.owner;status.value=filters.status;append(filterBar,search,owner,status);p.append(filterBar);const result=el('div');const counter=el('div','table-footer');function update(){filters={q:search.value,owner:owner.value,status:status.value};const q=filters.q.trim().toLocaleLowerCase();const rows=arr(state.task_views).filter(r=>(!q||[r.id,r.title,r.entity_id,r.object_name,r.owner,r.category].some(v=>String(v||'').toLocaleLowerCase().includes(q)))&&(!filters.owner||r.owner===filters.owner)&&(!filters.status||r.fulfillment_status===filters.status));result.replaceChildren(table(taskColumns(),rows,'没有符合筛选条件的任务。'));counter.textContent='当前 '+rows.length+' 条 / 全部 '+arr(state.task_views).length+' 条';}search.addEventListener('input',update);owner.addEventListener('change',update);status.addEventListener('change',update);append(p,result,counter);page.append(p);update();}
  function appendOptions(select,all,values){const first=el('option','',all);first.value='';select.append(first);[...new Set(values.filter(v=>v!==undefined&&v!==null&&v!==''))].sort((a,b)=>String(a).localeCompare(String(b),'zh-CN')).forEach(v=>{const option=el('option','',v);option.value=String(v);select.append(option);});}
  function renderObjects(){const page=$('page');append(page,header(label('object','业务对象')+'台账','保留稳定业务编号，关联任务和执行数据。',downloadButton('objects')));const rows=arr(datasets().objects);const counts=Object.create(null);arr(state.task_views).forEach(t=>{counts[t.entity_id]=(counts[t.entity_id]||0)+1;});const p=panel(label('object','业务对象')+'清单','名称用于阅读，业务编号用于关联');p.append(table([{key:'id',label:'业务编号',className:'mono'},{key:'name',label:'名称',className:'table-title'},{key:'group',label:'分组 / 区域'},{key:'owner',label:'负责人'},{label:'关联任务',render:r=>counts[r.id]||0}],rows,'尚未导入业务对象台账。'));page.append(p);}
  function evidenceNode(value){if(!value)return text(value);try{const url=new URL(String(value));if(url.protocol==='http:'||url.protocol==='https:'){const a=el('a','',String(value));a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';return a;}}catch(_){}return String(value);}
  function renderExecutions(){const page=$('page');append(page,header(label('execution','执行验收')+'台账','每条执行有独立编号，数量与验收结果共同构成可核对事实。',downloadButton('executions')),notice('证据链接不等于验收通过。有效完成量按已确认的验收规则计算；不同任务的计量单位分别核对。'));const p=panel('执行明细','只展示来源文件中的执行记录');p.append(table([{key:'id',label:'执行编号',className:'mono'},{key:'task_id',label:'关联任务'},{key:'occurred_date',label:'执行日期'},{label:'数量',render:r=>number(r.quantity)},{label:'验收结果',render:r=>badge(r.accepted===true||r.accepted==='true'||r.accepted===1?'已验收':r.accepted===false||r.accepted==='false'||r.accepted===0?'未验收':'待确认')},{label:'证据 / 说明',render:r=>evidenceNode(r.evidence)}],arr(datasets().executions),'尚未导入执行或验收记录。'));page.append(p);}
  function financeCards(rows){const grid=el('div','finance-grid');for(const r of rows){const block=el('div','finance-block');block.append(el('div','finance-currency',r.currency||'未指定币种'));for(const item of [['收入',r.income],['支出',r.cost],['收支差额',r.net]])append(block,append(el('div','finance-line'),el('span','muted',item[0]),el('span','mono',number(item[1]))));grid.append(block);}return grid;}
  function renderFinance(){const page=$('page');append(page,header('收支分析','按入账日期、收支方向与原始币种统计。',downloadButton('transactions')),notice('汇总只计入标记为“实际”的流水，估算与待确认金额单列于明细。不同币种分别汇总；收支差额不能自动视为会计净利润。'));const rows=arr(state.summary.finance);if(rows.length){const p=panel('币种汇总','仅实际流水的收入、支出与差额');const b=el('div','panel-body');b.append(financeCards(rows));p.append(b);page.append(p);}const p=panel('流水明细','所有金额按文件原始币种展示；仅实际口径进入汇总');p.append(table([{key:'id',label:'流水编号',className:'mono'},{key:'date',label:'入账日期'},{key:'entity_id',label:label('object','业务对象')+'编号'},{key:'task_id',label:'任务编号'},{label:'方向',render:r=>r.type==='income'?'收入':r.type==='cost'?'支出':text(r.type)},{label:'金额',className:'mono',render:r=>number(r.amount)},{key:'currency',label:'币种'},{label:'口径',render:r=>badge(r.basis==='actual'?'实际':r.basis==='estimate'?'估算':'待确认')}],arr(datasets().transactions),'尚未导入收入或支出流水。'));page.append(p);}
  function renderData(){const page=$('page');append(page,header('数据质量与来源','查看导入批次、数据规模与需要核对的事项。'),notice('新增数据或更新文件时，请把文件提供给助手，由助手校验字段映射并执行导入或刷新。当前页面读取已生成的数据快照。'));const warnings=arr(state.quality.warnings);const checks=panel('数据提示',warnings.length?'共 '+warnings.length+' 项待关注事项':'本次快照没有额外数据提示');const body=el('div','panel-body');if(warnings.length){const list=el('div','quality-list');warnings.forEach(w=>list.append(el('div','quality-item',w)));body.append(list);}else body.append(el('div','notice','没有额外提示不代表业务数据已经经过人工复核；正式使用前仍应抽样核对。'));checks.append(body);page.append(checks);const counts=el('div','cards');for(const item of [['objects',label('object','业务对象')],['tasks',label('task','任务')],['executions',label('execution','执行记录')],['transactions','收支流水']]){const card=el('div','metric');append(card,el('div','metric-label',item[1]),el('div','metric-number',number(arr(datasets()[item[0]]).length)),el('div','metric-note','当前快照记录数'));counts.append(card);}page.append(counts);const p=panel('导入批次','文件指纹用于识别来源和重复导入');p.append(table([{key:'created_at',label:'导入时间'},{key:'dataset',label:'数据集'},{label:'行数',className:'mono',render:r=>number(r.row_count)},{key:'id',label:'批次编号',className:'mono'},{key:'sha256',label:'文件 SHA-256',className:'mono source-id'}],arr(state.quality.batches),'尚无导入批次记录。'));page.append(p);}
  function moduleEnabled(id){return arr(state.workspace.modules).includes(id);}
  function renderNav(){const nav=$('nav');nav.replaceChildren();for(const item of moduleDefinitions.filter(m=>moduleEnabled(m.id))){const b=button('',()=>navigate(item.id),activePage===item.id?'active':'');append(b,el('span','nav-icon',item.icon),el('span','',item.label));if(activePage===item.id)b.setAttribute('aria-current','page');nav.append(b);}}
  function navigate(id){activePage=id;render();$('sidebar').classList.remove('open');$('menu-toggle').setAttribute('aria-expanded','false');window.scrollTo(0,0);}
  function render(){if(!state)return;const allowed=moduleDefinitions.filter(m=>moduleEnabled(m.id));if(!allowed.some(m=>m.id===activePage))activePage=allowed.length?allowed[0].id:'';document.title=state.workspace.title||'业务工作台';$('brand-title').textContent=state.workspace.title||'业务工作台';$('breadcrumb').textContent=(allowed.find(m=>m.id===activePage)||{}).label||'工作空间';renderNav();$('page').replaceChildren();const renderers={dashboard:renderDashboard,tasks:renderTasks,objects:renderObjects,executions:renderExecutions,finance:renderFinance,data:renderData};if(renderers[activePage])renderers[activePage]();else $('page').append(empty('当前蓝图没有启用页面模块，请让助手检查工作空间配置。'));$('footer').replaceChildren(el('span','','本地单人模式 · 数据截至 '+text(state.workspace.as_of)+' · '+text(state.workspace.timezone)),el('span','','逾期按快照日期判定；重新生成或刷新导入后更新。'));}
  async function load(){const response=await fetch('/api/state',{cache:'no-store',credentials:'same-origin'});if(!response.ok)throw new Error('读取工作空间失败（HTTP '+response.status+'）');const next=await response.json();if(!next.workspace||!next.datasets||!next.summary||!next.quality)throw new Error('工作空间数据结构不完整，请检查生成结果。');state=next;$('global-error').classList.add('hidden');render();}
  function showGlobalError(error){$('global-error').textContent=errorText(error);$('global-error').classList.remove('hidden');}
  function detail(name,value){return append(el('div'),el('div','detail-label',name),el('div','detail-value',text(value)));}
  function openTask(task){$('dialog-title').textContent=task.title||'任务跟进';$('dialog-id').textContent='任务编号 '+text(task.id);const body=$('dialog-body');body.replaceChildren();const details=el('div','details');append(details,detail(label('object','业务对象'),task.object_name||task.entity_id),detail('负责人',task.owner),detail('来源状态',task.status),detail('业务判定',task.fulfillment_status),detail('到期日',task.due_date),detail('计划数量',task.planned_quantity===null||task.planned_quantity===undefined?'—':number(task.planned_quantity)+' '+(task.unit||'')),detail('已验收数量',task.accepted_quantity===null||task.accepted_quantity===undefined?'—':number(task.accepted_quantity)+' '+(task.unit||'')),detail('剩余数量',task.remaining_quantity===null||task.remaining_quantity===undefined?'—':number(task.remaining_quantity)+' '+(task.unit||'')));body.append(details,notice('这里只保存人工跟进状态和备注。完成与验收判定仍以来源记录和已确认规则为准。'));const form=el('form');const statusLabel=el('label','form-label','跟进状态');statusLabel.htmlFor='tracking-status';const select=el('select');select.id='tracking-status';for(const value of ['待跟进','跟进中','已跟进']){const option=el('option','',value);option.value=value;select.append(option);}select.value=['待跟进','跟进中','已跟进'].includes(task.tracking_status)?task.tracking_status:'待跟进';const noteLabel=el('label','form-label','跟进备注');noteLabel.htmlFor='tracking-note';const note=el('textarea');note.id='tracking-note';note.maxLength=5000;note.placeholder='记录下一步动作、待确认事项或跟进结果…';note.value=task.note||'';const message=el('div','notice error hidden');message.setAttribute('role','alert');const actions=el('div','dialog-actions');const cancel=button('取消',()=>$('task-dialog').close());const save=el('button','primary','保存跟进');save.type='submit';append(actions,cancel,save);append(form,statusLabel,select,noteLabel,note,message,actions);form.addEventListener('submit',async event=>{event.preventDefault();save.disabled=true;message.classList.add('hidden');try{const response=await fetch('/api/task-update',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:task.id,tracking_status:select.value,note:note.value,csrf_token:state.csrf_token})});let result;try{result=await response.json();}catch(_){throw new Error('保存响应格式异常（HTTP '+response.status+'）');}if(!response.ok||result.ok!==true)throw new Error(result.error||'保存失败（HTTP '+response.status+'）');try{await load();$('task-dialog').close();}catch(error){message.textContent='跟进已保存，读取最新数据失败：'+errorText(error);message.classList.remove('hidden');}}catch(error){message.textContent=errorText(error);message.classList.remove('hidden');}finally{save.disabled=false;}});body.append(form);if(!$('task-dialog').open)$('task-dialog').showModal();}
  $('menu-toggle').addEventListener('click',()=>{const opened=$('sidebar').classList.toggle('open');$('menu-toggle').setAttribute('aria-expanded',String(opened));});
  $('dialog-close').addEventListener('click',()=>$('task-dialog').close());
  $('reload').addEventListener('click',async()=>{const b=$('reload');b.disabled=true;try{await load();}catch(error){showGlobalError(error);}finally{b.disabled=false;}});
  load().catch(error=>{showGlobalError(error);$('page').replaceChildren(empty('无法读取本地工作空间。请确认通过助手提供的本地服务地址打开。'));});
  </script>
</body>
